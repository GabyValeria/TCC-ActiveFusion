<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ActiveFusion</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="logos/2.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <script>
        function togglePassword(inputId, iconId) {
            const passwordField = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.className = 'ri-eye-line';
            } else {
                passwordField.type = 'password';
                icon.className = 'ri-eye-close-line';
            }
        }

        function validatePassword() {
            const password = document.getElementById('password').value;
            const criteria = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                specialChar: /[\W_]/.test(password)
            };

            for (const [key, isValid] of Object.entries(criteria)) {
                document.getElementById(key).style.color = isValid ? 'green' : 'red';
            }
        }
    </script>
    <style>
        .password-criteria {
            font-size: 0.9em;
            margin-top: 5px;
        }

        .password-criteria p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Cadastro</h1>
        <form action="register.php" method="POST" id="registerForm">
            <input type="text" name="first_name" placeholder="Nome" required>
            <input type="text" name="last_name" placeholder="Sobrenome" required>
            <input type="text" name="username" placeholder="Nome de Usuário" required>
            <input type="email" name="email" placeholder="E-mail" required>
            
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Senha" required oninput="validatePassword()">
                <i class="ri-eye-close-line" id="togglePasswordIcon" onclick="togglePassword('password', 'togglePasswordIcon')"></i>
            </div>
            
            <div class="password-criteria">
                <p id="length">Mínimo de 8 caracteres</p>
                <p id="uppercase">Pelo menos 1 letra maiúscula</p>
                <p id="lowercase">Pelo menos 1 letra minúscula</p>
                <p id="number">Pelo menos 1 número</p>
                <p id="specialChar">Pelo menos 1 caractere especial</p>
            </div>

            <div class="password-container">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme a Senha" required>
                <i class="ri-eye-close-line" id="toggleConfirmPasswordIcon" onclick="togglePassword('confirm_password', 'toggleConfirmPasswordIcon')"></i>
            </div>

            <button class="nav__btn" type="submit">
                <span class="text">Cadastrar</span>
            </button>
        </form>
        <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
    </div>
</body>
</html>

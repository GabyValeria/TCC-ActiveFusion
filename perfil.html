<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | ActiveFusion</title>
  <link rel="icon" href="logos/2.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;400;500;600;700&display=swap');

    :root {
      --primary-color:  #ffffff;
      --primary-color-light: #ff9999;
      --primary-color-extra-light: #ffcc99;
      --secondary-color: #330099;
      --secondary-color-dark: #3c03ad;
      --secondary-color-extra-dark: #000000;
      --text-light: #1b1b1b;
      --white: #ffffff;
      --max-width: 1200px;
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f5f5;
      color: var(--text-light);
    }

    header {
      background-color: var(--secondary-color);
      color: var(--primary-color);
      padding: 20px 0;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 20px;
    }

    .profile-header {
      margin-bottom: 20px;
    }

    .profile-picture img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid var(--primary-color);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .username {
      font-size: 28px;
      font-weight: 600;
      margin-top: 10px;
    }

    .full-name {
      font-size: 18px;
      font-weight: 400;
    }

    .profile-details {
      margin-top: 20px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 20px;
    }

    .stat {
      background-color: var(--primary-color);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      width: 120px;
    }

    .stat h2 {
      margin: 0;
      font-size: 24px;
      color: var(--secondary-color);
    }

    .stat p {
      font-size: 14px;
      color: var(--text-light);
    }

    .bio {
      background-color: var(--primary-color);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .bio h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: var(--secondary-color);
    }

    .bio p {
      font-size: 14px;
      line-height: 1.6;
    }

    /* Menu de navegação */
    nav {
      background-color: var(--secondary-color-dark);
      padding: 10px 0;
      margin-top: 20px;
    }

    nav ul {
      display: flex;
      justify-content: center;
      gap: 40px;
    }

    nav ul li {
      list-style: none;
    }

    nav ul li a {
      text-decoration: none;
      color: var(--primary-color);
      font-size: 16px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    nav ul li a:hover {
      background-color: var(--primary-color-light);
      color: var(--secondary-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="profile-header">
        <div class="profile-picture">
          <img src="avatares/1.png" alt="Foto de perfil de Bruna Silva">
        </div>
        <h1 class="username">@brunasilva</h1>
        <p class="full-name">Bruna Silva</p>
      </div>
      <nav>
        <ul>
          <li><a href="feed.html">Feed</a></li>
          <li><a href="#configuracoes">Configurações</a></li>
          <li><a href="#sair">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container profile-details">
    <div class="stats">
      <div class="stat">
        <h2>1</h2>
        <p>Seguidores</p>
      </div>
      <div class="stat">
        <h2>1</h2>
        <p>Seguindo</p>
      </div>
    </div>

    <div class="bio">
      <h3>Sobre Mim</h3>
      <p>Entusiasta de fitness e saúde. Aqui para compartilhar meu progresso e me conectar com outros apaixonados por uma vida saudável!</p>
    </div>
  </main>
</body>
</html>

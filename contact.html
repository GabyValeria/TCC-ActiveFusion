<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | ActiveFusion</title>
    <link rel="stylesheet" href="styles/contact.css">
    <link rel="icon" href="logos/2.png" type="image/png">
</head>
<body>
    <div class="contact-container">
        <h1>Fale Conosco</h1>
        <p>Estamos aqui para ajudar. Preencha o formulário abaixo e entraremos em contato o mais rápido possível.</p>
        <form action="process_contact.php" method="POST" id="contactForm">
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" name="name" placeholder="Seu nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
            </div>
            <div class="form-group">
                <label for="subject">Assunto</label>
                <input type="text" id="subject" name="subject" placeholder="Assunto da mensagem" required>
            </div>
            <div class="form-group">
                <label for="message">Mensagem</label>
                <textarea id="message" name="message" placeholder="Escreva sua mensagem" rows="5" required></textarea>
            </div>
            <button class="contact-btn" type="submit">
                <span class="text">Enviar</span>
            </button>
        </form>
    </div>
    <script src="scripts/contact.js"></script>
</body>
</html>
